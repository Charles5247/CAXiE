services:
  # ── PUBLIC SITE ────────────────────────────────────────────────────────────
  # Serves caxietechnologies.com and www.caxietechnologies.com
  # APP_MODE=public  → proxy returns 404 on any /admin path
  - type: web
    name: caxie-public
    runtime: node
    plan: starter
    region: frankfurt  # closest to Nigeria / lowest latency from West Africa

    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── Deployment mode (controls proxy route isolation) ────────────────────
      - key: APP_MODE
        value: public
      # ── Supabase ──────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false   # set in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # ── Formspree ─────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_FORMSPREE_ENDPOINT
        sync: false
      # ── Admin CMS credentials (kept on public service for API proxy auth) ─
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── ADMIN SITE ─────────────────────────────────────────────────────────────
  # Serves admin.caxietechnologies.com (DNS CNAME → this service's .onrender.com URL)
  # APP_MODE=admin   → proxy returns 404 on any non-/admin path
  # Owner action required: add DNS CNAME record for admin.caxietechnologies.com
  #   once this service is deployed and its .onrender.com URL is known.
  - type: web
    name: caxie-admin
    runtime: node
    plan: starter
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /admin

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── Deployment mode ────────────────────────────────────────────────────
      - key: APP_MODE
        value: admin
      # ── Supabase ──────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # ── Admin CMS credentials ──────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

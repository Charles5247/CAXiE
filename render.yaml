services:
  # ── PUBLIC SITE ────────────────────────────────────────────────────────────
  # Serves caxietechnologies.com and www.caxietechnologies.com
  # APP_MODE=public  → proxy returns 404 on any /admin path
  - type: web
    name: caxie-public
    runtime: node
    plan: starter
    region: frankfurt  # closest to Nigeria / lowest latency from West Africa

    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── Deployment mode (controls proxy route isolation) ────────────────────
      - key: APP_MODE
        value: public
      # ── Supabase ──────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false   # set in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # ── Formspree ─────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_FORMSPREE_ENDPOINT
        sync: false
      # ── Admin CMS credentials (kept on public service for API proxy auth) ─
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── ADMIN SITE ─────────────────────────────────────────────────────────────
  # Serves https://admin-caxie.onrender.com (service name → .onrender.com URL)
  # APP_MODE=admin   → proxy returns 404 on any non-/admin path
  # Optional: add a DNS CNAME record for admin.caxietechnologies.com later
  #   pointing to admin-caxie.onrender.com if a custom admin domain is desired.
  - type: web
    name: admin-caxie
    runtime: node
    plan: starter
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /admin

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ── Deployment mode ────────────────────────────────────────────────────
      - key: APP_MODE
        value: admin
      # ── Public site URL (used for "View site" links from the admin console) ─
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caxietechnologies.com
      # ── Supabase ──────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # ── Admin CMS credentials ──────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
